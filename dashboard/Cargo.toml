[package]
name = "elenchus-dashboard"
version = "0.1.0"
edition = "2021"
description = "Elenchus OS Sentinel Control Center — Obsidian Lumina design system"
authors = ["Elenchus OS Team"]
license = "MIT"

[[bin]]
name = "elenchus-dashboard"
path = "src/main.rs"

[dependencies]
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software", "renderer-femtovg"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.4"

# Linux-only: Unix socket for Intent Bus + statvfs
[target.'cfg(unix)'.dependencies]
libc = "0.2"
tokio = { version = "1.38", features = ["full", "net"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
