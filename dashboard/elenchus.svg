<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyan-Violet Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0091FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    
    <!-- Core E Gradient -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Node Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Emblem Shield -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" 
           fill="#0B0F19" 
           stroke="url(#ringGrad)" 
           stroke-width="5" 
           stroke-linejoin="round"/>

  <!-- Inner Subtle Hexagon Ring -->
  <polygon points="64,18 106,41 106,87 64,110 22,87 22,41" 
           fill="none" 
           stroke="#00E5FF" 
           stroke-width="1.5" 
           stroke-dasharray="6,4" 
           opacity="0.4"/>

  <!-- Stylized Modern 'E' (Elenchus) -->
  <!-- Vertical Spine -->
  <path d="M 40,34 L 52,34 L 52,94 L 40,94 Z" 
        fill="url(#eGrad)" 
        rx="2"/>

  <!-- Top Arm -->
  <path d="M 40,34 L 92,34 C 95,34 96,37 94,40 L 88,46 C 87,47 85,48 83,48 L 40,48 Z" 
        fill="url(#eGrad)"/>

  <!-- Middle Arm (Core AI Bus Node) -->
  <path d="M 40,58 L 74,58 L 74,70 L 40,70 Z" 
        fill="url(#eGrad)"/>
  <circle cx="74" cy="64" r="8" fill="url(#nodeGlow)"/>
  <circle cx="74" cy="64" r="4.5" fill="#FFFFFF"/>

  <!-- Bottom Arm -->
  <path d="M 40,80 L 83,80 C 85,80 87,81 88,82 L 94,88 C 96,91 95,94 92,94 L 40,94 Z" 
        fill="url(#eGrad)"/>

  <!-- Corner Tech Accent Dots -->
  <circle cx="64" cy="8" r="3" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="116" cy="36" r="3" fill="#0091FF"/>
  <circle cx="116" cy="92" r="3" fill="#7B2CBF"/>
  <circle cx="64" cy="120" r="3" fill="#00E5FF"/>
  <circle cx="12" cy="92" r="3" fill="#7B2CBF"/>
  <circle cx="12" cy="36" r="3" fill="#0091FF"/>
</svg>
